workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hamme ASC   # Team settings > Integrations > Developer Portal (API key name)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6791659254
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.akash.hammeapp
    scripts:
      - name: Create .env
        script: |
          cat <<EOF > .env
          API_BASE_URL=https://backend-three-kappa-24.vercel.app/api/v1
          API_BASE_URL_PROD=https://backend-three-kappa-24.vercel.app/api/v1
          APP_SCHEME=hamme
          SHARE_LINK_BASE=https://client-sigma-beryl-15.vercel.app/poll
          APP_HOST=client-sigma-beryl-15.vercel.app
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: |
          # Fall back to pod update when Podfile.lock pins pod versions that an
          # upgraded plugin no longer accepts (e.g. a Firebase major bump).
          cd ios && (pod install --repo-update || pod update)
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          # TestFlight rejects reused build numbers, so continue from the latest upload.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 28)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Android App Bundle
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      groups:
        - android_signing # UPLOAD_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
    scripts:
      - name: Create .env
        script: |
          cat <<EOF > .env
          API_BASE_URL=https://backend-three-kappa-24.vercel.app/api/v1
          API_BASE_URL_PROD=https://backend-three-kappa-24.vercel.app/api/v1
          APP_SCHEME=hamme
          SHARE_LINK_BASE=https://client-sigma-beryl-15.vercel.app/poll
          APP_HOST=client-sigma-beryl-15.vercel.app
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Configure release signing
        script: |
          set -eu
          : "${UPLOAD_KEYSTORE_BASE64:?Missing UPLOAD_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          mkdir -p android/keystore
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/keystore/upload-keystore.jks
          cat > android/keystore/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../keystore/upload-keystore.jks
          EOF
      - name: Verify upload certificate and build App Bundle
        script: |
          set -eu
          ACTUAL_SHA1=$(keytool -list -v \
            -keystore android/keystore/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" | sed -n 's/^[[:space:]]*SHA1: //p')
          EXPECTED_SHA1='70:E0:D1:AC:82:30:3B:A2:BA:52:A2:66:7B:C5:CF:43:12:61:32:CA'
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || {
            echo "Upload certificate mismatch: $ACTUAL_SHA1"
            exit 1
          }
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
